apiVersion: v1
kind: Service
metadata:
  name: nginx-service          # Name of the service
spec:
  selector:
    app: nginx                 # Selector to link the service to the Nginx deployment
  ports:
    - protocol: TCP
      port: 80                 # Port inside the cluster
      targetPort: 80           # Port the container is listening on
      nodePort: 30007          # Exposed port on the host
  type: NodePort               # Exposing as NodePort for external access
